name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint (config in .golangci.yml)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.1/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.1
          "$(go env GOPATH)/bin/golangci-lint" config verify
          "$(go env GOPATH)/bin/golangci-lint" run

      - name: go test (race detector enabled)
        run: go test -race ./...

      - name: release-sync idempotency (manifest mode)
        run: go run ./cmd/release-sync -check
