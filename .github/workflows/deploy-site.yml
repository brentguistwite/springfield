name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/index.html'
      - 'docs/fonts/**'
      - 'docs/img/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stage only the public landing page + fonts so internal docs/*.md
      # are never published. .nojekyll disables Jekyll so fonts/ serve as-is.
      - name: Stage site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp -r docs/fonts _site/fonts
          cp -r docs/img _site/img
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
